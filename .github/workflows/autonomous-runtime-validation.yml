name: Autonomous Runtime Validation

on:
  workflow_dispatch:
    inputs:
      run_cycle:
        description: "Execute one autonomous cycle against the deployed API"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_URL}" || { echo "Repository variable PRODUCTION_API_URL is required."; exit 1; }
          case "${API_URL}" in
            https://*) ;;
            *) echo "PRODUCTION_API_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Check public health
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${API_URL}/api/v1/health"

      - name: Check public readiness
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${API_URL}/api/v1/ready"

      - name: Validate authenticated autonomous endpoints
        if: ${{ env.HAS_RUNTIME_TOKEN == 'true' }}
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          TOKEN: ${{ secrets.AUTONOMOUS_RUNTIME_TOKEN }}
          HAS_RUNTIME_TOKEN: ${{ secrets.AUTONOMOUS_RUNTIME_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${TOKEN}")

          status_code="$(curl --silent --show-error -o /tmp/status.json -w '%{http_code}' "${API_URL}/api/v1/autonomous/status" "${auth[@]}")"
          test "${status_code}" = "200"
          cat /tmp/status.json

          health_code="$(curl --silent --show-error -o /tmp/autonomous-health.json -w '%{http_code}' "${API_URL}/api/v1/autonomous/health" "${auth[@]}")"
          test "${health_code}" = "200"
          cat /tmp/autonomous-health.json

          preview_code="$(curl --silent --show-error -o /tmp/preview.json -w '%{http_code}' "${API_URL}/api/v1/autonomous/preview" "${auth[@]}")"
          test "${preview_code}" = "200"
          cat /tmp/preview.json

      - name: Execute one autonomous cycle
        if: ${{ inputs.run_cycle && env.HAS_RUNTIME_TOKEN == 'true' }}
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          TOKEN: ${{ secrets.AUTONOMOUS_RUNTIME_TOKEN }}
          HAS_RUNTIME_TOKEN: ${{ secrets.AUTONOMOUS_RUNTIME_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/cycle.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            "${API_URL}/api/v1/autonomous/cycles/run")"
          case "${code}" in
            200|202) ;;
            *) echo "Unexpected autonomous cycle status: ${code}"; cat /tmp/cycle.json; exit 1 ;;
          esac
          cat /tmp/cycle.json

      - name: Explain skipped authenticated checks
        if: ${{ env.HAS_RUNTIME_TOKEN != 'true' }}
        env:
          HAS_RUNTIME_TOKEN: ${{ secrets.AUTONOMOUS_RUNTIME_TOKEN != '' }}
        run: echo "AUTONOMOUS_RUNTIME_TOKEN is not configured; only public health/readiness were checked."
