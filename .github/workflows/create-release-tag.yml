name: Create Release Tag

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: create-release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Create or refresh version-matched release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          tag_commit="$(git rev-list -n 1 "${tag}^{}" 2>/dev/null || true)"

          if [ -n "${tag_commit}" ] && [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "Release tag ${tag} points to ${tag_commit}; refreshing it to ${GITHUB_SHA}."
            git push origin ":refs/tags/${tag}"
            git tag -d "${tag}" >/dev/null 2>&1 || true
            tag_commit=""
          fi

          if [ -z "${tag_commit}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
            git push origin "refs/tags/${tag}"
          else
            echo "Release tag ${tag} already points to the current release commit."
          fi

          tag_version="$(
            git show "${tag}:package.json" |
              node -e 'let input=""; process.stdin.on("data", chunk => { input += chunk; }); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));'
          )"
          test "${tag_version}" = "${version}" || {
            echo "Release tag ${tag} contains package version ${tag_version}, expected ${version}."
            exit 1
          }
