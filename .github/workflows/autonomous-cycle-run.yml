name: Autonomous Cycle Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.PRODUCTION_API_URL }}
      TOKEN: ${{ secrets.AUTONOMOUS_RUNTIME_TOKEN }}
    steps:
      - name: Validate runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_URL}" || { echo "Repository variable PRODUCTION_API_URL is required."; exit 1; }
          case "${API_URL}" in
            https://*) ;;
            *) echo "PRODUCTION_API_URL must use HTTPS."; exit 1 ;;
          esac
          test -n "${TOKEN}" || { echo "Repository secret AUTONOMOUS_RUNTIME_TOKEN is required."; exit 1; }

      - name: Verify deployment health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${API_URL}/api/v1/health" >/tmp/health.json
          cat /tmp/health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${API_URL}/api/v1/ready" >/tmp/ready.json
          cat /tmp/ready.json

      - name: Run one autonomous cycle
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/cycle.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            "${API_URL}/api/v1/autonomous/cycles/run")"
          echo "HTTP status: ${code}"
          cat /tmp/cycle.json
          case "${code}" in
            200|202) ;;
            *) exit 1 ;;
          esac

      - name: Read autonomous status
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${TOKEN}" \
            "${API_URL}/api/v1/autonomous/status"
