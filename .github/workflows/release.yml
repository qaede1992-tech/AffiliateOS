name: Release

on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${version}" || {
            echo "Release tag ${RELEASE_TAG} must match package.json version v${version}."
            exit 1
          }

      - name: Install dependencies and verify release commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run db:check

      - name: Validate production runtime configuration
        shell: bash
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://release:release@localhost:5432/release
          API_AUTH_TOKEN: release-preflight-test-token-123456789012345678901234
          API_CORS_ORIGIN: https://dashboard.example.com
          AUTONOMOUS_CYCLE_ENABLED: "false"
        run: npm run production:preflight --workspace @affiliateos/api

      - name: Validate production web origin
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VITE_API_URL}" || {
            echo "VITE_API_URL is required. Set repository variable PRODUCTION_API_URL."
            exit 1
          }
          case "${VITE_API_URL}" in
            https://*) ;;
            *) echo "VITE_API_URL must use HTTPS for a production release."; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: api-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/affiliateos-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/affiliateos-api:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Build and push web image
        id: web-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/affiliateos-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/affiliateos-web:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Smoke test release images against migrated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm --force affiliateos-api-smoke >/dev/null 2>&1 || true; docker rm --force affiliateos-postgres-smoke >/dev/null 2>&1 || true; docker rm --force affiliateos-web-smoke >/dev/null 2>&1 || true; docker network rm affiliateos-release-smoke >/dev/null 2>&1 || true' EXIT
          token='release-smoke-test-token-123456789012345678901234'
          docker network create affiliateos-release-smoke
          docker run --detach --name affiliateos-postgres-smoke --network affiliateos-release-smoke \
            --env POSTGRES_DB=release \
            --env POSTGRES_USER=release \
            --env POSTGRES_PASSWORD=release \
            postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec affiliateos-postgres-smoke pg_isready -U release -d release >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs affiliateos-postgres-smoke
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network affiliateos-release-smoke \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env DATABASE_URL=postgresql://release:release@affiliateos-postgres-smoke:5432/release \
            node:24-alpine sh -c 'npm ci --ignore-scripts && npm run db:migrate'
          docker run --detach --name affiliateos-api-smoke --network affiliateos-release-smoke \
            --env NODE_ENV=production \
            --env API_HOST=0.0.0.0 \
            --env API_PORT=3001 \
            --env DATABASE_URL=postgresql://release:release@affiliateos-postgres-smoke:5432/release \
            --env API_AUTH_TOKEN="$token" \
            --env API_CORS_ORIGIN=https://dashboard.example.com \
            affiliateos-api:\${{ github.sha }}
          for attempt in $(seq 1 30); do
            if docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -fsS http://affiliateos-api-smoke:3001/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs affiliateos-api-smoke
              exit 1
            fi
            sleep 2
          done
          readiness_status=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -sS -o /dev/null -w '%{http_code}' http://affiliateos-api-smoke:3001/api/v1/ready)
          test "$readiness_status" = '200'
          unauthorized_status=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -sS -o /dev/null -w '%{http_code}' http://affiliateos-api-smoke:3001/api/v1/auth/me)
          test "$unauthorized_status" = '401'
          authorized_status=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://affiliateos-api-smoke:3001/api/v1/auth/me)
          test "$authorized_status" = '200'
          login_headers=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -sS -D - -o /dev/null -H 'Content-Type: application/json' --data "{\"token\":\"$token\"}" http://affiliateos-api-smoke:3001/api/v1/auth/login)
          printf '%s\n' "$login_headers" | grep -Fi 'Set-Cookie: affiliateos_session=' >/dev/null
          printf '%s\n' "$login_headers" | grep -Fi 'HttpOnly' >/dev/null
          printf '%s\n' "$login_headers" | grep -Fi 'SameSite=Strict' >/dev/null
          docker run --detach --name affiliateos-web-smoke --network affiliateos-release-smoke affiliateos-web:\${{ github.sha }}
          for attempt in $(seq 1 20); do
            if docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -fsS http://affiliateos-web-smoke/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs affiliateos-web-smoke
          exit 1

      - name: Write immutable image digests
        shell: bash
        env:
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${API_DIGEST}"
          test -n "${WEB_DIGEST}"
          {
            printf 'release_tag=%s\n' "${RELEASE_TAG}"
            printf 'api_image=ghcr.io/%s/affiliateos-api@%s\n' "${GITHUB_REPOSITORY_OWNER}" "${API_DIGEST}"
            printf 'web_image=ghcr.io/%s/affiliateos-web@%s\n' "${GITHUB_REPOSITORY_OWNER}" "${WEB_DIGEST}"
          } > release-images.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" --generate-notes --verify-tag
          gh release upload "${RELEASE_TAG}" release-images.txt --clobber
