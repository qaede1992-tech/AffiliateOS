name: Release

on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${version}" || {
            echo "Release tag ${RELEASE_TAG} must match package.json version v${version}."
            exit 1
          }

      - name: Install dependencies and verify release commit
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm run db:check

      - name: Validate production web origin
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VITE_API_URL}" || {
            echo "VITE_API_URL is required. Set repository variable PRODUCTION_API_URL."
            exit 1
          }
          case "${VITE_API_URL}" in
            https://*) ;;
            *) echo "VITE_API_URL must use HTTPS for a production release."; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: api-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/affiliateos-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/affiliateos-api:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Build and push web image
        id: web-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/affiliateos-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/affiliateos-web:${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Write immutable image digests
        shell: bash
        env:
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          WEB_DIGEST: ${{ steps.web-image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${API_DIGEST}"
          test -n "${WEB_DIGEST}"
          {
            printf 'release_tag=%s\n' "${RELEASE_TAG}"
            printf 'api_image=ghcr.io/%s/affiliateos-api@%s\n' "${GITHUB_REPOSITORY_OWNER}" "${API_DIGEST}"
            printf 'web_image=ghcr.io/%s/affiliateos-web@%s\n' "${GITHUB_REPOSITORY_OWNER}" "${WEB_DIGEST}"
          } > release-images.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${RELEASE_TAG}" --generate-notes --verify-tag\n          gh release upload "${RELEASE_TAG}" release-images.txt --clobber
