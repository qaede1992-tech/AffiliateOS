name: Production Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: affiliateos
          POSTGRES_USER: affiliateos
          POSTGRES_PASSWORD: affiliateos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affiliateos -d affiliateos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: timeout --signal=TERM --kill-after=30s 15m npm test
      - name: Validate production configuration contract
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://release:release@127.0.0.1:5432/release
          API_AUTH_TOKEN: 12345678901234567890123456789012
          API_CORS_ORIGIN: https://dashboard.example.com
          AUTONOMOUS_CYCLE_ENABLED: "false"
        run: npm run production:preflight --workspace @affiliateos/api

      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Check migrations
        run: npm run db:check
      - name: Configure release database
        run: printf 'DATABASE_URL=postgresql://affiliateos:affiliateos@localhost:5432/affiliateos\n' > .env
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify migrated database
        run: npm run db:verify
      - name: Verify release migration state
        run: npm run db:verify:applied

  container-images:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API release image
        run: docker build --file apps/api/Dockerfile --tag affiliateos-api:${{ github.sha }} .
      - name: Build web release image
        run: docker build --file apps/web/Dockerfile --build-arg VITE_API_URL=https://api.example.invalid --tag affiliateos-web:${{ github.sha }} .
      - name: Inspect release images
        run: |
          docker image inspect affiliateos-api:${{ github.sha }} >/dev/null
          docker image inspect affiliateos-web:${{ github.sha }} >/dev/null
      - name: Smoke test API release image
        run: |
          set -euo pipefail
          docker network create affiliateos-release-smoke
          docker run --detach --name affiliateos-postgres-smoke --network affiliateos-release-smoke \
            --env POSTGRES_DB=release \
            --env POSTGRES_USER=release \
            --env POSTGRES_PASSWORD=release \
            postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker run --rm --network affiliateos-release-smoke postgres:16-alpine pg_isready -h affiliateos-postgres-smoke -U release -d release; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs affiliateos-postgres-smoke
              exit 1
            fi
            sleep 2
          done
          docker run --rm --network affiliateos-release-smoke \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env DATABASE_URL=postgresql://release:release@affiliateos-postgres-smoke:5432/release \
            node:24-alpine sh -c 'npm ci --ignore-scripts && npm run db:migrate'
          docker run --detach --name affiliateos-api-smoke --network affiliateos-release-smoke \
            --env NODE_ENV=production \
            --env API_HOST=0.0.0.0 \
            --env API_PORT=3001 \
            --env DATABASE_URL=postgresql://release:release@affiliateos-postgres-smoke:5432/release \
            --env API_AUTH_TOKEN=release-smoke-test-token-123456789012345678901234 \
            --env API_CORS_ORIGIN=https://dashboard.example.com \
            affiliateos-api:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -fsS http://affiliateos-api-smoke:3001/api/v1/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs affiliateos-api-smoke
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 30); do
            if docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -fsS http://affiliateos-api-smoke:3001/api/v1/ready; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs affiliateos-api-smoke
              exit 1
            fi
            sleep 2
          done
          unauthorized_status=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -s -o /dev/null -w '%{http_code}' http://affiliateos-api-smoke:3001/api/v1/auth/me)
          [ "$unauthorized_status" = "401" ]
          authorized_status=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer release-smoke-test-token-123456789012345678901234' http://affiliateos-api-smoke:3001/api/v1/auth/me)
          [ "$authorized_status" = "200" ]
          login_headers=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -sS -D - -o /dev/null -H 'Content-Type: application/json' --data '{"token":"release-smoke-test-token-123456789012345678901234"}' http://affiliateos-api-smoke:3001/api/v1/auth/login)
          printf '%s\n' "$login_headers" | grep -Fi 'Set-Cookie: affiliateos_session=' >/dev/null
          printf '%s\n' "$login_headers" | grep -Fi 'HttpOnly' >/dev/null
          printf '%s\n' "$login_headers" | grep -Fi 'SameSite=Strict' >/dev/null
          security_headers=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -sS -D - -o /dev/null http://affiliateos-api-smoke:3001/api/v1/health)
          printf '%s\n' "$security_headers" | grep -Fi 'X-Content-Type-Options: nosniff' >/dev/null
          printf '%s\n' "$security_headers" | grep -Fi 'X-Frame-Options: DENY' >/dev/null
          printf '%s\n' "$security_headers" | grep -Fi 'Referrer-Policy: no-referrer' >/dev/null
          printf '%s\n' "$security_headers" | grep -Fi 'Permissions-Policy:' >/dev/null
          printf '%s\n' "$security_headers" | grep -Fi 'Strict-Transport-Security:' >/dev/null
          cors_headers=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -sS -D - -o /dev/null -H 'Origin: https://dashboard.example.com' http://affiliateos-api-smoke:3001/api/v1/health)
          printf '%s\n' "$cors_headers" | grep -Fi 'Access-Control-Allow-Origin: https://dashboard.example.com' >/dev/null
          printf '%s\n' "$cors_headers" | grep -Fi 'Access-Control-Allow-Credentials: true' >/dev/null
          rejected_cors_headers=$(docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -sS -D - -o /dev/null -H 'Origin: https://unexpected.example.com' http://affiliateos-api-smoke:3001/api/v1/health)
          if printf '%s\n' "$rejected_cors_headers" | grep -Fi 'Access-Control-Allow-Origin: https://unexpected.example.com' >/dev/null; then
            echo 'Unexpected CORS origin was allowed'
            exit 1
          fi
      - name: Smoke test web release image
        run: |
          docker run --detach --name affiliateos-web-smoke --network affiliateos-release-smoke affiliateos-web:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if docker run --rm --network affiliateos-release-smoke curlimages/curl:8.16.0 -fsS http://affiliateos-web-smoke/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs affiliateos-web-smoke
          exit 1
      - name: Cleanup release smoke containers
        if: always()
        run: |
          docker rm -f affiliateos-api-smoke affiliateos-web-smoke affiliateos-postgres-smoke 2>/dev/null || true
          docker network rm affiliateos-release-smoke 2>/dev/null || true

  release-gate:
    runs-on: ubuntu-latest
    needs: container-images
    steps:
      - name: Release gate
        run: |
          echo "AffiliateOS production release candidate validated."
          echo "External deployment remains gated on approved infrastructure, secret-manager references, official provider credentials/scopes, TLS, and production database controls."
