name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: affiliateos
          POSTGRES_USER: affiliateos
          POSTGRES_PASSWORD: affiliateos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affiliateos -d affiliateos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Check migrations
        run: npm run db:check
      - name: Configure CI database environment
        run: printf 'DATABASE_URL=postgresql://affiliateos:affiliateos@localhost:5432/affiliateos\n' > .env
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify migrated database
        run: npm run db:verify

  containers:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag affiliateos-api:ci .
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag affiliateos-web:ci .
      - name: Smoke test API container
        run: |
          set -euo pipefail
          trap 'docker rm --force affiliateos-api >/dev/null 2>&1 || true' EXIT
          token='ci-smoke-test-token-123456789012345678901234'
          docker run --detach --name affiliateos-api --publish 3001:3001 \
            --env DATABASE_URL=postgresql://affiliateos:affiliateos@127.0.0.1:5432/affiliateos \
            --env API_CORS_ORIGIN=http://localhost:5173 \
            --env API_AUTH_TOKEN="$token" \
            affiliateos-api:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs affiliateos-api
              exit 1
            fi
            sleep 1
          done
          unauthorized_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/v1/auth/me)
          test "$unauthorized_status" = '401'
          authorized_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" \
            http://127.0.0.1:3001/api/v1/auth/me)
          test "$authorized_status" = '200'
      - name: Smoke test web container
        run: |
          set -euo pipefail
          trap 'docker rm --force affiliateos-web >/dev/null 2>&1 || true' EXIT
          docker run --detach --name affiliateos-web --publish 8080:80 affiliateos-web:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs affiliateos-web
          exit 1
