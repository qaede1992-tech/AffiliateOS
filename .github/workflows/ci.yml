name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: affiliateos
          POSTGRES_USER: affiliateos
          POSTGRES_PASSWORD: affiliateos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affiliateos -d affiliateos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        env:
          DATABASE_URL: postgresql://affiliateos:affiliateos@localhost:5432/affiliateos
        run: |
          printf 'DATABASE_URL=postgresql://affiliateos:affiliateos@localhost:5432/affiliateos\n' > .env
          node --env-file=.env apps/api/scripts/prepare-public-schema-privilege-check.mjs
          npm run db:migrate
          timeout --signal=TERM --kill-after=30s 15m npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Check migrations
        run: npm run db:check
      - name: Check new migration timestamps
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node apps/api/scripts/check-migration-timestamps.mjs
      - name: Configure CI database environment
        run: printf 'DATABASE_URL=postgresql://affiliateos:affiliateos@localhost:5432/affiliateos\n' > .env
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify migrated database
        run: npm run db:verify
      - name: Verify public-schema privileges
        run: node --env-file=.env apps/api/scripts/check-public-schema-privileges.mjs
      - name: Verify runtime-role RLS baseline
        run: node --env-file=.env apps/api/scripts/check-runtime-role-security.mjs
      - name: Simulate audited production migration drift
        env:
          CI_MIGRATION_DRIFT_TEST: "1"
        run: node --env-file=.env apps/api/scripts/simulate-production-migration-drift.mjs
      - name: Apply forward-only repair to drifted CI database
        run: npm run db:migrate
      - name: Verify repaired drifted database
        run: npm run db:verify:applied
      - name: Verify public-schema privileges after forward repair
        run: node --env-file=.env apps/api/scripts/check-public-schema-privileges.mjs
      - name: Verify runtime-role RLS baseline after forward repair
        run: node --env-file=.env apps/api/scripts/check-runtime-role-security.mjs
      - name: Simulate production state with migration 0060 pending
        env:
          CI_PENDING_0060_TEST: "1"
        run: node --env-file=.env apps/api/scripts/simulate-pending-0060-migration.mjs
      - name: Apply pending migration 0060 with the real Drizzle migrator
        run: npm run db:migrate
      - name: Verify migration 0060 was applied from the production-like state
        run: npm run db:verify:applied
      - name: Verify public-schema privileges after migration 0060
        run: node --env-file=.env apps/api/scripts/check-public-schema-privileges.mjs
      - name: Verify runtime-role RLS baseline after migration 0060
        run: node --env-file=.env apps/api/scripts/check-runtime-role-security.mjs

  containers:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag affiliateos-api:ci .
      # Exercise the same vertical render pipeline used by ProductPromoVideoRenderer, not just binary availability.
      - name: Smoke test real FFmpeg product promo render
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh affiliateos-api:ci -ec '
            tmp="$(mktemp -d)"
            trap "rm -rf \"$tmp\"" EXIT
            ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=320x240:d=1 -frames:v 1 "$tmp/source.png"
            printf "Produk Uji\nLihat detail produk" > "$tmp/overlay.txt"
            ffmpeg -hide_banner -loglevel error -y \
              -loop 1 -framerate 25 -i "$tmp/source.png" \
              -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,zoompan=z='min(zoom+0.0007,1.10)':d=300:s=720x1280:fps=25,drawtext=fontfile=/usr/share/fonts/dejavu/DejaVuSans.ttf:textfile=$tmp/overlay.txt:reload=0:fontcolor=white:fontsize=42:borderw=3:bordercolor=black:box=1:boxcolor=black@0.55:boxborderw=24:x=(w-text_w)/2:y=h*0.76,fade=t=in:st=0:d=0.5,fade=t=out:st=11:d=1" \
              -t 12 -r 25 -an -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -movflags +faststart "$tmp/promo.mp4"
            probe="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -show_entries format=duration -of default=noprint_wrappers=1 "$tmp/promo.mp4")"
            printf "%s\n" "$probe"
            printf "%s\n" "$probe" | grep -Fx "codec_name=h264"
            printf "%s\n" "$probe" | grep -Fx "width=720"
            printf "%s\n" "$probe" | grep -Fx "height=1280"
            duration="$(printf "%s\n" "$probe" | sed -n "s/^duration=//p")"
            awk -v duration="$duration" "BEGIN { if (duration < 11.9 || duration > 12.1) exit 1 }"
            test -s "$tmp/promo.mp4"
          '
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --build-arg VITE_API_URL=http://localhost:3001 --tag affiliateos-web:ci .
      - name: Smoke test API container
        run: |
          set -euo pipefail
          trap 'docker rm --force affiliateos-api >/dev/null 2>&1 || true; docker rm --force affiliateos-postgres >/dev/null 2>&1 || true; docker network rm affiliateos-smoke >/dev/null 2>&1 || true' EXIT
          token='ci-smoke-test-token-123456789012345678901234'
          docker network create affiliateos-smoke
          docker run --detach --name affiliateos-postgres --network affiliateos-smoke \
            --env POSTGRES_DB=affiliateos \
            --env POSTGRES_USER=affiliateos \
            --env POSTGRES_PASSWORD=affiliateos \
            postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec affiliateos-postgres pg_isready -U affiliateos -d affiliateos >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs affiliateos-postgres
              exit 1
            fi
            sleep 1
          done
          docker run --detach --name affiliateos-api --network affiliateos-smoke --publish 3001:3001 \
            --env DATABASE_URL=postgresql://affiliateos:affiliateos@affiliateos-postgres:5432/affiliateos \
            --env API_CORS_ORIGIN=http://localhost:5173 \
            --env API_AUTH_TOKEN="$token" \
            affiliateos-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs affiliateos-api
              exit 1
            fi
            sleep 1
          done
          readiness_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/v1/ready)
          test "$readiness_status" = '200'
          unauthorized_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/api/v1/auth/me)
          test "$unauthorized_status" = '401'
          authorized_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" \
            http://127.0.0.1:3001/api/v1/auth/me)
          test "$authorized_status" = '200'
          cookie_headers=$(curl --silent --include --request POST --header 'Content-Type: application/json' --data "{\"token\":\"$token\"}" http://127.0.0.1:3001/api/v1/auth/login)
          printf '%s\n' "$cookie_headers" | grep -F 'affiliateos_session=' >/dev/null
          printf '%s\n' "$cookie_headers" | grep -F 'HttpOnly' >/dev/null
          printf '%s\n' "$cookie_headers" | grep -F 'SameSite=Strict' >/dev/null
      - name: Smoke test web container
        run: |
          set -euo pipefail
          trap 'docker rm --force affiliateos-web >/dev/null 2>&1 || true' EXIT
          docker run --detach --name affiliateos-web --publish 8080:80 affiliateos-web:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs affiliateos-web
              exit 1
            fi
            sleep 1
          done
          for attempt in $(seq 1 20); do
            health_status=$(docker inspect --format '{{.State.Health.Status}}' affiliateos-web)
            if [ "$health_status" = "healthy" ]; then
              break
            fi
            if [ "$health_status" = "unhealthy" ] || [ "$attempt" -eq 20 ]; then
              docker inspect affiliateos-web
              exit 1
            fi
            sleep 1
          done
