name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: affiliateos
          POSTGRES_USER: affiliateos
          POSTGRES_PASSWORD: affiliateos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affiliateos -d affiliateos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Check migrations
        run: npm run db:check
      - name: Configure CI database environment
        run: printf 'DATABASE_URL=postgresql://affiliateos:affiliateos@localhost:5432/affiliateos\n' > .env
      - name: Apply migrations
        run: npm run db:migrate
      - name: Verify migrated database
        run: npm run db:verify

  containers:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag affiliateos-api:ci .
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag affiliateos-web:ci .
