services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: affiliateos
      POSTGRES_USER: affiliateos
      POSTGRES_PASSWORD: affiliateos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliateos -d affiliateos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - affiliateos-postgres:/var/lib/postgresql/data

volumes:
  affiliateos-postgres: